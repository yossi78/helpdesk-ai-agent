name: ticket_stats
description: Summarize the support ticket queue by status and priority.

# Live Ollama provider (native /api/chat). Start the server first:
#   docker compose up ollama
# First boot pulls llama3.2 (~2GB). Then:
#   python run.py scenarios/ticket_stats.yaml
provider:
  type: ollama
  base_url: http://127.0.0.1:11434
  model: llama3.2
  timeout: 120

max_iterations: 10

tools:
  - ticket_stats

system_prompt: >
  You are a help-desk agent. Use only the ticket_stats tool to gather numbers;
  do not invent counts. First call ticket_stats with no arguments for the
  whole queue. Then call ticket_stats with user_id "u-42" for Alice Wong.
  After both results, summarize and stop.

initial_message: "Give me a snapshot of the support ticket queue, then Alice Wong's (u-42) ticket load."

evaluation:
  must:
    - tool: ticket_stats
      min_count: 2

expected_verdict: pass
